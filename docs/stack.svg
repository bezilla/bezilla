<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 772" width="1240" height="772" role="img" aria-labelledby="t d">
<title id="t">Five repositories: a stack of three joined by one real dependency and one conceptual one, and two that stand alone</title>
<desc id="d">Three repositories are drawn as a vertical stack, in the same order as the three-repos diagram in kubernetes-platform-reference: the application on top, the platform in the middle, the cloud underneath. otel-service-reference, a Go service instrumented with OpenTelemetry, sits at the top. A SOLID arrow runs down from it to kubernetes-platform-reference. That edge is real but optional: the platform deploys this workload, building its sample image from a sibling checkout at ../otel-service-reference when one is on disk. It does not clone the repository, and without that checkout it builds a fallback workload instead, losing only the telemetry. A DASHED arrow runs down from kubernetes-platform-reference to terragrunt-reference-architecture, and dashed means conceptual rather than real: neither repository references the other in code, configuration or CI, and the platform brings itself up on kind. To the right of a dashed divider, and joined to nothing, stand two further repositories. capsize is a read-only Kubernetes CLI that scores cost waste against blast radius and says where cutting one raises the other, pointing at any cluster through an existing kubeconfig. switchyard is an inference gateway: it routes inference across three simulated providers, fails over when one breaks, and ramps traffic back as it recovers. Neither capsize nor switchyard depends on any of the other three, and no arrow touches them.</desc>
