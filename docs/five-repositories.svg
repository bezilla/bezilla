<text x="56" y="52" fill="#f0f6fc" font-size="26" font-weight="700">Five repositories: what depends on what</text>
<text x="56" y="80" fill="#8b949e" font-size="14">Three of them form a stack; capsize and switchyard depend on nothing here, so nothing joins them to it.</text>
<text x="56" y="118" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="0.08em">ONE STACK &#183; TWO EDGES</text>
<text x="848" y="118" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="0.08em">STANDS ALONE &#183; DEPENDS ON NOTHING HERE</text>
