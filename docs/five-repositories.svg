<text x="893.0" y="458" fill="#8b949e" font-size="11" text-anchor="middle">Go</text>
<rect x="918" y="442" width="122" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="979.0" y="458" fill="#8b949e" font-size="11" text-anchor="middle">circuit breaker</text>
