<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 772" width="1240" height="772" role="img" aria-labelledby="t d">
<title id="t">Five repositories: a stack of three joined by one real dependency and one conceptual one, and two that stand alone</title>
<desc id="d">Three repositories are drawn as a vertical stack. terragrunt-reference-architecture, an AWS estate of EKS, Aurora and a CloudFront/WAF edge across management, staging and prod accounts, sits at the top. A DASHED arrow runs from it down to kubernetes-platform-reference, and dashed means conceptual rather than real: neither repository references the other in code, configuration or CI, and the platform brings itself up on kind. A SOLID arrow runs from kubernetes-platform-reference down to otel-service-reference, and that one is a real dependency, though an optional one: the platform builds its sample image from a sibling checkout at ../otel-service-reference if that checkout is present on disk. It does not clone the repository. Without the checkout it builds a fallback workload instead and only the telemetry is lost. To the right of a dashed divider, and joined to nothing, stand two further repositories. capsize is a read-only Kubernetes CLI that points at any cluster through an existing kubeconfig. switchyard is an independent inference gateway with its own simulated providers. Neither capsize nor switchyard depends on any of the other three, and no arrow touches them.</desc>
<style>text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}</style>
<rect width="1240" height="772" fill="#0d1117"/>
