<text x="150" y="289" fill="#f0f6fc" font-size="12" font-weight="700">conceptual &#8212; not a dependency</text>
<text x="150" y="306" fill="#8b949e" font-size="12">Neither repository names the other in code, configuration or CI. The platform</text>
<text x="150" y="323" fill="#8b949e" font-size="12">brings itself up on kind; this is the estate it would run on, and nothing more.</text>
