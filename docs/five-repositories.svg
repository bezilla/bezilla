<text x="84" y="406" fill="#f0f6fc" font-size="20" font-weight="700">kubernetes-platform-reference</text>
<text x="84" y="430" fill="#c9d1d9" font-size="13">A complete Kubernetes platform, up on a laptop in about five minutes.</text>
