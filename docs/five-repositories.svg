<text x="272.5" y="682" fill="#8b949e" font-size="11" text-anchor="middle">traces + metrics</text>
<rect x="345" y="666" width="81" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="385.5" y="682" fill="#8b949e" font-size="11" text-anchor="middle">exemplars</text>
<rect x="848" y="136" width="336" height="148" rx="12" fill="#11161d" stroke="#30363d" stroke-width="1" stroke-dasharray="7 5"/>
<rect x="848" y="136" width="5" height="148" rx="2.5" fill="#3fb950"/>
<text x="876" y="166" fill="#3fb950" font-size="11" font-weight="700" letter-spacing="0.08em">READ-ONLY CLI</text>
<text x="876" y="196" fill="#f0f6fc" font-size="20" font-weight="700">capsize</text>
<text x="876" y="220" fill="#c9d1d9" font-size="13">Points at any cluster through the kubeconfig</text>
<text x="876" y="238" fill="#c9d1d9" font-size="13">kubectl already uses. No agent, no</text>
<text x="876" y="256" fill="#c9d1d9" font-size="13">cluster-side install, no account.</text>
