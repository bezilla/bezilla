<rect x="263" y="444" width="102" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="314.0" y="460" fill="#8b949e" font-size="11" text-anchor="middle">cert-manager</text>
<rect x="373" y="444" width="170" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="458.0" y="460" fill="#8b949e" font-size="11" text-anchor="middle">Kyverno &#183; Enforce</text>
<rect x="551" y="444" width="115" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="608.5" y="460" fill="#8b949e" font-size="11" text-anchor="middle">OTel Collector</text>
<rect x="674" y="444" width="47" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="697.5" y="460" fill="#8b949e" font-size="11" text-anchor="middle">Helm</text>
<path d="M132 472 L132 564" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text x="150" y="496" fill="#f0f6fc" font-size="12" font-weight="700">real, and optional</text>
<text x="150" y="514" fill="#8b949e" font-size="12">scripts/sample-image.sh builds the sample image from a sibling checkout at</text>
<text x="150" y="530" fill="#8b949e" font-size="12">../otel-service-reference when it is on disk. It does not clone it. Without one</text>
<text x="150" y="548" fill="#8b949e" font-size="12">it builds bootstrap/fallback-workload instead, and only the telemetry is lost.</text>
<rect x="56" y="568" width="712" height="126" rx="12" fill="#11161d" stroke="#30363d" stroke-width="1"/>
<rect x="56" y="568" width="5" height="126" rx="2.5" fill="#f0883e"/>
<text x="84" y="598" fill="#f0883e" font-size="11" font-weight="700" letter-spacing="0.08em">THE WORKLOAD</text>
<text x="84" y="628" fill="#f0f6fc" font-size="20" font-weight="700">otel-service-reference</text>
<text x="84" y="652" fill="#c9d1d9" font-size="13">The instrumented Go service the platform deploys. Shares no code &#8212; only OTLP.</text>
