<text x="1092.0" y="458" fill="#8b949e" font-size="11" text-anchor="middle">Prometheus</text>
<text x="56" y="730" fill="#8b949e" font-size="12">Each of the five runs on its own. The one real edge is a build-time read of a path on disk &#8212; not a network fetch, and not a clone.</text>
